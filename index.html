<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Personas</title>
  <style>
    :root {
      --bg: #eef2f4;
      --ink: #172026;
      --muted: #5d6b74;
      --line: #d5dee3;
      --panel: #ffffff;
      --nav: #12343b;
      --nav-text: #d7e4e7;
      --accent: #0f6f78;
      --danger: #9d2c2c;
      --ok: #176b45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    aside {
      background: var(--nav);
      color: white;
      padding: 28px 18px;
    }

    aside p {
      margin: 6px 0 0;
      color: var(--nav-text);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 28px;
    }

    nav button {
      text-align: left;
      border: 0;
      border-radius: 10px;
      padding: 12px 12px;
      background: transparent;
      color: var(--nav-text);
      font: inherit;
      cursor: pointer;
    }

    nav button.activo,
    nav button:hover {
      background: #1d4d56;
      color: white;
    }

    main {
      padding: 28px;
    }

    .panel {
      max-width: 920px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }

    h2 { margin: 0 0 6px; font-size: 26px; }

    .ayuda {
      margin: 0 0 18px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }

    .acciones {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button.primario,
    button.peligro,
    button.secundario {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
    }

    button.primario { background: var(--accent); color: white; }
    button.peligro { background: var(--danger); color: white; }
    button.secundario { background: #e7eef0; color: var(--ink); }

    .aviso {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #e8f6ef;
      color: var(--ok);
    }

    .aviso.error {
      background: #fdecec;
      color: var(--danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
    }

    th { font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }

    .vacio {
      padding: 18px 0;
      color: var(--muted);
    }

    .ficha {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f4f7f8;
      font-family: Consolas, monospace;
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      aside { padding: 18px; }
      nav { display: grid; grid-template-columns: 1fr 1fr; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Sistema de Personas</h1>
      <p>El mismo menú de la terminal, en el navegador.</p>
      <nav>
        <button type="button" data-vista="listar" class="activo">1. Mostrar todas</button>
        <button type="button" data-vista="agregar">2. Agregar persona</button>
        <button type="button" data-vista="buscar">3. Buscar por ID</button>
        <button type="button" data-vista="actualizar">4. Actualizar</button>
        <button type="button" data-vista="eliminar">5. Eliminar</button>
      </nav>
    </aside>
    <main>
      <section class="panel" id="vista"></section>
    </main>
  </div>
  <script>
    const CLAVE = "sistema-personas-registros";
    const vista = document.querySelector("#vista");
    const botones = document.querySelectorAll("nav button");

    function leer() {
      const datos = JSON.parse(localStorage.getItem(CLAVE) || '{"siguiente":1,"personas":[]}');
      datos.personas.sort((a, b) => a.id - b.id);
      return datos;
    }

    function guardar(datos) {
      localStorage.setItem(CLAVE, JSON.stringify(datos));
    }

    function texto(valor) {
      return String(valor ?? "").trim();
    }

    function entero(valor) {
      if (!/^-?\d+$/.test(texto(valor))) {
        return null;
      }
      return Number(texto(valor));
    }

    function aviso(mensaje, esError) {
      return `<div class="aviso${esError ? " error" : ""}">${mensaje}</div>`;
    }

    function mostrar(nombre) {
      botones.forEach((boton) => {
        boton.classList.toggle("activo", boton.dataset.vista === nombre);
      });
      const vistas = { listar, agregar, buscar, actualizar, eliminar };
      vistas[nombre]();
    }

    function listar(mensaje) {
      const personas = leer().personas;
      const filas = personas.map((persona) => `
        <tr>
          <td>${persona.id}</td>
          <td>${escapar(persona.nombre)}</td>
          <td>${persona.edad}</td>
          <td>${escapar(persona.correo)}</td>
        </tr>
      `).join("");

      vista.innerHTML = `
        <h2>Mostrar todas las personas</h2>
        <p class="ayuda">ID, nombre, edad y correo, igual que en la terminal.</p>
        ${mensaje || ""}
        ${personas.length === 0
          ? `<p class="vacio">No hay personas registradas.</p>`
          : `<table>
              <thead>
                <tr><th>ID</th><th>NOMBRE</th><th>EDAD</th><th>CORREO</th></tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>`}
      `;
    }

    function agregar() {
      vista.innerHTML = `
        <h2>Agregar persona</h2>
        <p class="ayuda">Escribe los datos. El ID se asigna solo.</p>
        <form id="forma">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" maxlength="100" required>
          <label for="edad">Edad</label>
          <input id="edad" name="edad" inputmode="numeric" required>
          <label for="correo">Correo</label>
          <input id="correo" name="correo" maxlength="150" required>
          <div class="acciones">
            <button class="primario" type="submit">Guardar</button>
          </div>
        </form>
        <div id="resultado"></div>
      `;

      vista.querySelector("#forma").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const datosFormulario = new FormData(evento.target);
        const nombre = texto(datosFormulario.get("nombre"));
        const edad = entero(datosFormulario.get("edad"));
        const correo = texto(datosFormulario.get("correo"));
        const resultado = vista.querySelector("#resultado");

        if (!nombre || !correo) {
          resultado.innerHTML = aviso("El valor no puede estar vacío.", true);
          return;
        }
        if (edad === null) {
          resultado.innerHTML = aviso("Escribe un número entero válido.", true);
          return;
        }

        const datos = leer();
        if (datos.personas.some((persona) => persona.correo.toLowerCase() === correo.toLowerCase())) {
          resultado.innerHTML = aviso("Ya existe una persona con ese correo.", true);
          return;
        }

        const persona = { id: datos.siguiente, nombre, edad, correo };
        datos.personas.push(persona);
        datos.siguiente += 1;
        guardar(datos);
        evento.target.reset();
        resultado.innerHTML = aviso(`Persona guardada con ID: ${persona.id}`);
      });
    }

    function buscar() {
      vista.innerHTML = `
        <h2>Buscar persona por ID</h2>
        <form id="forma">
          <label for="id">ID a buscar</label>
          <input id="id" name="id" inputmode="numeric" required>
          <div class="acciones">
            <button class="primario" type="submit">Buscar</button>
          </div>
        </form>
        <div id="resultado"></div>
      `;

      vista.querySelector("#forma").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const id = entero(new FormData(evento.target).get("id"));
        const resultado = vista.querySelector("#resultado");
        if (id === null) {
          resultado.innerHTML = aviso("Escribe un número entero válido.", true);
          return;
        }
        const persona = leer().personas.find((item) => item.id === id);
        resultado.innerHTML = persona
          ? `<p>Persona encontrada:</p><div class="ficha">${ficha(persona)}</div>`
          : aviso(`No existe una persona con ID ${id}.`, true);
      });
    }

    function actualizar() {
      vista.innerHTML = `
        <h2>Actualizar persona</h2>
        <form id="buscar-id">
          <label for="id">ID de la persona a actualizar</label>
          <input id="id" name="id" inputmode="numeric" required>
          <div class="acciones">
            <button class="secundario" type="submit">Cargar datos</button>
          </div>
        </form>
        <div id="resultado"></div>
      `;

      vista.querySelector("#buscar-id").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const id = entero(new FormData(evento.target).get("id"));
        const resultado = vista.querySelector("#resultado");
        if (id === null) {
          resultado.innerHTML = aviso("Escribe un número entero válido.", true);
          return;
        }
        const persona = leer().personas.find((item) => item.id === id);
        if (!persona) {
          resultado.innerHTML = aviso(`No existe una persona con ID ${id}.`, true);
          return;
        }

        resultado.innerHTML = `
          <p>Datos actuales:</p>
          <div class="ficha">${ficha(persona)}</div>
          <p>Escribe los nuevos datos.</p>
          <form id="forma">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" maxlength="100" value="${escapar(persona.nombre)}" required>
            <label for="edad">Edad</label>
            <input id="edad" name="edad" inputmode="numeric" value="${persona.edad}" required>
            <label for="correo">Correo</label>
            <input id="correo" name="correo" maxlength="150" value="${escapar(persona.correo)}" required>
            <div class="acciones">
              <button class="primario" type="submit">Actualizar</button>
            </div>
          </form>
          <div id="estado"></div>
        `;

        resultado.querySelector("#forma").addEventListener("submit", (envio) => {
          envio.preventDefault();
          const datosFormulario = new FormData(envio.target);
          const nombre = texto(datosFormulario.get("nombre"));
          const edad = entero(datosFormulario.get("edad"));
          const correo = texto(datosFormulario.get("correo"));
          const estado = resultado.querySelector("#estado");

          if (!nombre || !correo) {
            estado.innerHTML = aviso("El valor no puede estar vacío.", true);
            return;
          }
          if (edad === null) {
            estado.innerHTML = aviso("Escribe un número entero válido.", true);
            return;
          }

          const datos = leer();
          const actual = datos.personas.find((item) => item.id === id);
          if (!actual) {
            estado.innerHTML = aviso(`No existe una persona con ID ${id}.`, true);
            return;
          }
          const correoRepetido = datos.personas.some((item) =>
            item.id !== id && item.correo.toLowerCase() === correo.toLowerCase()
          );
          if (correoRepetido) {
            estado.innerHTML = aviso("Ya existe una persona con ese correo.", true);
            return;
          }

          actual.nombre = nombre;
          actual.edad = edad;
          actual.correo = correo;
          guardar(datos);
          estado.innerHTML = aviso("Persona actualizada correctamente.");
        });
      });
    }

    function eliminar() {
      vista.innerHTML = `
        <h2>Eliminar persona</h2>
        <form id="forma">
          <label for="id">ID de la persona a eliminar</label>
          <input id="id" name="id" inputmode="numeric" required>
          <div class="acciones">
            <button class="peligro" type="submit">Eliminar</button>
          </div>
        </form>
        <div id="resultado"></div>
      `;

      vista.querySelector("#forma").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const id = entero(new FormData(evento.target).get("id"));
        const resultado = vista.querySelector("#resultado");
        if (id === null) {
          resultado.innerHTML = aviso("Escribe un número entero válido.", true);
          return;
        }
        const datos = leer();
        const cantidad = datos.personas.length;
        datos.personas = datos.personas.filter((persona) => persona.id !== id);
        if (datos.personas.length === cantidad) {
          resultado.innerHTML = aviso(`No existe una persona con ID ${id}.`, true);
          return;
        }
        guardar(datos);
        evento.target.reset();
        resultado.innerHTML = aviso("Persona eliminada correctamente.");
      });
    }

    function ficha(persona) {
      return `Persona{id=${persona.id}, nombre='${escapar(persona.nombre)}', edad=${persona.edad}, correo='${escapar(persona.correo)}'}`;
    }

    function escapar(valor) {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    botones.forEach((boton) => {
      boton.addEventListener("click", () => mostrar(boton.dataset.vista));
    });

    mostrar("listar");
  </script>
</body>
</html>
